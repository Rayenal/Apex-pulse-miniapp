<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070605"><title>ApexPulse</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#f5c451;--g2:#c8921c;--g3:#ffe9a8;--bg:#070605;--c:#14110a;--c2:#201a0e;--t:#f6edd6;--m:#9a8e72;--ok:#5ee6a0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;color:var(--t);font:14px/1.4 Inter,-apple-system,system-ui,sans-serif}
body{background:radial-gradient(110% 55% at 50% -8%,#4a3409,transparent 62%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh;height:var(--tg-viewport-stable-height,100dvh);padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.logo{font:800 20px Cinzel,Georgia,serif;letter-spacing:2px;background:linear-gradient(90deg,var(--g3),var(--g),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.on-b{font-size:10px;font-weight:700;color:var(--ok);letter-spacing:1px}
.on-b::before{content:"";display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.3}}
header .btn{padding:8px 12px;font-size:12px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tab{display:none}.tab.on{display:block;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h2{font:800 22px Cinzel,Georgia,serif;letter-spacing:1px;color:var(--g3);margin:2px 0}
.m{color:var(--m);font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.g{color:var(--g);font-weight:700}.big{font-size:22px;font-weight:800;display:block}
.card{background:linear-gradient(155deg,var(--c2),var(--c));border:1px solid rgba(245,196,81,.38);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 0 20px rgba(245,196,81,.09),inset 0 0 22px rgba(245,196,81,.04)}
.row,.prof,.task,.mn,.link{display:flex;align-items:center;justify-content:space-between;gap:10px}
.prof,.task,.mn{justify-content:flex-start}.fx{flex:1;min-width:0}
.av{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font:800 18px Cinzel,serif;color:#2a1c02;background:linear-gradient(135deg,var(--g3),var(--g2));box-shadow:0 0 12px rgba(245,196,81,.5)}
.ic{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#0c0a05;border:1px solid rgba(245,196,81,.4)}
.lv,.pill{font-size:10px;font-weight:800;padding:4px 9px;border-radius:99px;border:1px solid var(--g);color:var(--g);white-space:nowrap}
.lv.ok{color:var(--ok);border-color:var(--ok)}.lv.no{color:#ff7a7a;border-color:#ff7a7a}
.assets{text-align:center}.bal{font:800 34px Cinzel,Georgia,serif;color:var(--g3);text-shadow:0 0 18px rgba(245,196,81,.5)}.bal small{font-size:14px;color:var(--g)}
.tick{color:var(--ok);font-weight:700;font-size:12px}
.cw{position:relative;padding:8px 0}
.coin{display:grid;place-items:center;position:relative;width:min(62vw,240px);aspect-ratio:1;margin:0 auto;border-radius:50%;touch-action:manipulation;background:radial-gradient(circle at 35% 28%,#fff6cf,#f5c451 36%,#b8860b 72%,#6b4a05);box-shadow:0 0 0 7px #2a1f08,0 0 0 9px rgba(245,196,81,.7),0 0 55px rgba(245,196,81,.5),inset 0 -12px 26px rgba(0,0,0,.35);animation:gl 3s ease-in-out infinite;transition:transform .09s}
.coin:active{transform:scale(.92)}
.coin::before{content:"";position:absolute;inset:13%;border-radius:50%;border:2px solid rgba(90,60,0,.5);box-shadow:inset 0 0 14px rgba(255,255,255,.4)}
.coin b{font:800 clamp(60px,20vw,92px) Cinzel,Georgia,serif;color:#5a3d03;text-shadow:0 2px 0 var(--g3)}
@keyframes gl{50%{filter:brightness(1.12)}}
.fab{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.fab button{width:40px;height:40px;border-radius:50%;font-weight:800;font-size:17px;color:var(--g);background:var(--c);border:1px solid var(--g);box-shadow:0 0 12px rgba(245,196,81,.3)}
.fab .off{opacity:.45;text-decoration:line-through}
.bar{height:10px;margin-top:6px;border-radius:9px;background:#0b0905;border:1px solid rgba(245,196,81,.3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g2),var(--g3));box-shadow:0 0 10px var(--g);transition:width .3s}
.btn{padding:9px 16px;border-radius:12px;font-weight:800;color:#2a1c02;background:linear-gradient(180deg,var(--g3),var(--g) 55%,var(--g2));box-shadow:0 0 14px rgba(245,196,81,.35);white-space:nowrap;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.95)}.btn:disabled{filter:grayscale(1) brightness(.45);box-shadow:none}
.btn.ghost{background:none;color:var(--g);border:1px solid var(--g);box-shadow:none}
.btn.fx{white-space:normal;line-height:1.2}.wide{width:100%;margin:4px 0}.sm{padding:6px 12px;font-size:12px;margin-top:6px}
.grid2,.grid3{display:grid;gap:10px;margin:10px 0}.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}
.grid2 .card{margin:0}.c{text-align:center}.grid3 b,.grid3 span,.grid2 span{display:block}
.ch{width:100%;height:92px;display:block;margin:8px 0;overflow:visible}
.mn.act{box-shadow:0 0 26px rgba(245,196,81,.35)}
.link span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--g3);background:#0b0905;padding:9px;border-radius:10px;border:1px dashed rgba(245,196,81,.4)}
.cert{text-align:center;border-width:2px;background:linear-gradient(155deg,#2c2108,#120e06)}
.cn{font:800 20px Cinzel,Georgia,serif;color:var(--g3);margin:6px 0}
.chip{display:inline-block;margin:6px 4px 0;padding:4px 10px;border-radius:99px;font-size:11px;border:1px solid rgba(245,196,81,.4)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid rgba(245,196,81,.12)}.kv:last-child{border:0}
.lnk{display:block;margin:6px auto;color:var(--m);font-size:11px;text-decoration:underline}
.sw{display:block;position:relative;width:48px;height:26px}.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:#0b0905;border:1px solid rgba(245,196,81,.45);transition:.25s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--m);transition:.25s}
.sw input:checked+i{background:#3a2a08;box-shadow:0 0 12px rgba(245,196,81,.5)}.sw input:checked+i::after{left:25px;background:var(--g)}
.fl{position:fixed;z-index:20;pointer-events:none;font:800 22px Inter,sans-serif;color:var(--g3);text-shadow:0 0 10px var(--g);animation:fl .9s forwards}
@keyframes fl{to{transform:translateY(-90px);opacity:0}}
nav{display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(10,8,5,.96);border-top:1px solid rgba(245,196,81,.3);box-shadow:0 -8px 24px rgba(245,196,81,.07)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10px;font-weight:700;color:var(--m);transition:.2s}
nav button.on{color:var(--g);text-shadow:0 0 10px rgba(245,196,81,.7)}nav button.on svg{filter:drop-shadow(0 0 5px var(--g))}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#to{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 62px);transform:translate(-50%,-14px);opacity:0;pointer-events:none;z-index:30;max-width:90vw;text-align:center;padding:10px 16px;border-radius:99px;font-weight:700;background:var(--c);border:1px solid var(--g);color:var(--g3);box-shadow:0 0 20px rgba(245,196,81,.35);transition:.25s}
#to.s{opacity:1;transform:translate(-50%,0)}
.sh{position:fixed;inset:0;z-index:25;display:none;align-items:flex-end;padding:14px;background:rgba(0,0,0,.72)}.sh.on{display:flex}.sh .card{width:100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><div id="app">
<header><div><div class="logo">ApexPulse</div><span class="on-b">ONLINE</span></div><button class="btn" id="wl" data-d="wallet">Connect Wallet</button></header>
<main>
<section id="mine" class="tab on">
<div class="card prof"><div class="av" id="av">A</div><div class="fx"><div class="m">User ID</div><b id="uid"></b></div><span class="lv" id="lv"></span></div>
<div class="card assets"><div class="m">Total Balance</div><div class="bal"><span id="bal">0.00</span> <small>APX</small></div><div class="tick" id="e24"></div></div>
<div class="cw"><button class="coin" id="coin" aria-label="Tap to mine"><b>A</b></button><div class="fab"><button id="fs" data-d="snd" aria-label="Sound">♪</button><button data-d="guide" aria-label="Guide">?</button></div></div>
<div class="card"><div class="row"><b id="enl" class="g">ENERGY</b><span class="m" id="enn"></span></div><div class="bar"><i id="enb"></i></div></div>
<div class="card row"><div><div class="m">Mined · Pending</div><b class="big g" id="pend">0.000</b></div><button class="btn" data-d="claim">CLAIM</button></div>
</section>
<section id="tasks" class="tab"></section><section id="miners" class="tab"></section><section id="friends" class="tab"></section><section id="profile" class="tab"></section>
</main>
<nav>
<button class="on" data-t="mine"><svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9zM2 9h20M9 3l3 6 3-6M12 9v12"/></svg>Mine</button>
<button data-t="tasks"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>Tasks</button>
<button data-t="miners"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>Miners</button>
<button data-t="friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 010 7M19 14c2 .8 3 2.8 3 6"/></svg>Friends</button>
<button data-t="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>Profile</button>
</nav></div>
<div id="to"></div>
<div class="sh" id="sh"><div class="card"><h2>How it works</h2><p style="margin:8px 0 12px;color:var(--m)">Tap the coin to mine. Each tap uses 1 energy.<br>Your miner also earns on its own, even offline.<br>Press CLAIM to move mined tokens to your balance.<br>Finish tasks, upgrade miners and invite friends to earn more.</p><button class="btn wide" data-d="close">Got it</button></div></div>
<script>
const tg=window.Telegram?.WebApp,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
try{tg?.ready();tg?.expand();tg?.disableVerticalSwipes?.();tg?.setHeaderColor?.('#070605');tg?.setBackgroundColor?.('#070605')}catch(e){}
const K='apexpulse_v1',BOT='ApexPulseBot',MAX=1000,PRICE=0.05,U=tg?.initDataUnsafe?.user;
const MN=[{n:'Starter Rig',th:1,p:0,tap:.01},{n:'Gold Forge',th:5,p:100,tap:.03},{n:'Platinum Array',th:20,p:500,tap:.08},{n:'Apex Quantum',th:100,p:2500,tap:0.2}];
const LV=[['Bronze',0],['Silver',50],['Gold',250],['Platinum',1000],['Diamond',5000]];
const TK=[{id:'ig',i:'📸',t:'Follow on Instagram',r:5,u:'https://instagram.com/'},{id:'igc',i:'💬',t:'Instagram Like / Comment',r:1,u:'https://www.instagram.com/apex.pulse27?xtok=MW8xMGQ4eDN2ZTU1OA%3D%3D'},{id:'yt',i:'▶️',t:'YouTube Engagement',r:1,u:'https://www.youtube.com/@rayen_al'},{id:'x',i:'🔁',t:'X / Twitter Retweet',r:1,u:'https://x.com/RayenAlya'},{id:'web',i:'🌐',t:'Visit Website',r:2,u:'https://x.com/RayenAlya'},{id:'bio',i:'📌',t:'Keep Channel in Bio',r:3,d:1}];
let sv={};try{sv=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
const S=Object.assign({bal:0,pend:0,life:0,en:MAX,ts:Date.now(),m:0,tk:{},snd:1,hist:{},w:'',ver:0,rf:{n:0,ok:0,cl:0},fam:0,id:U?.id||'AP'+(100000+Math.random()*899999|0)},sv);
const name=(U&&[U.first_name,U.last_name].filter(Boolean).join(' '))||'Apex Member';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const f=(n,d=2)=>(+n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sum=a=>a.reduce((x,y)=>x+y,0),hk=()=>Math.floor(Date.now()/36e5),mult=()=>1+S.m*.05;
const hist=()=>{const k=hk();return Array.from({length:24},(_,i)=>S.hist[k-23+i]||0)};
function earn(a){S.life+=a;const k=hk();S.hist[k]=(S.hist[k]||0)+a;for(const x in S.hist)if(x<k-23)delete S.hist[x]}
let ac;const beep=(fr=600,d=.07)=>{if(!S.snd)return;try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='triangle';o.frequency.value=fr;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}};
const hap=(t='light')=>{try{tg?.HapticFeedback?tg.HapticFeedback.impactOccurred(t):navigator.vibrate?.(8)}catch(e){}};
let tt;const toast=m=>{const e=$('#to');e.textContent=m;e.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('s'),2200)};
const fl=(x,y,t)=>{const e=document.createElement('div');e.className='fl';e.textContent=t;e.style.left=x-20+'px';e.style.top=y-30+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),900)};
const ext=u=>tg?.openLink?tg.openLink(u):window.open(u,'_blank'),link=()=>`https://t.me/${BOT}/app?startapp=ref_${S.id}`;
function upd(){let l=0;LV.forEach((v,i)=>{if(S.life>=v[1])l=i});
$('#uid').textContent=S.id;$('#av').textContent=name[0].toUpperCase();$('#lv').textContent=`${LV[l][0]} · LV${l+1}`;
$('#bal').textContent=f(S.bal);$('#e24').textContent='▲ +'+f(sum(hist()),3)+' APX · 24h';$('#pend').textContent=f(S.pend,3);
$('#enb').style.width=S.en/MAX*100+'%';$('#enl').textContent=S.en<1?'NO ENERGY':'ENERGY';$('#enn').textContent=Math.floor(S.en)+' / '+MAX;
$('#fs').classList.toggle('off',!S.snd);$('#wl').textContent=S.w?S.w.slice(0,4)+'…'+S.w.slice(-4):'Connect Wallet'}
const st=t=>{const x=S.tk[t.id];if(t.d)return!x||Date.now()-x>864e5?'claim':'done';if(!x)return'go';if(x==='d')return'done';return Date.now()-x>6e3?'claim':'wait'};
let sig='';
function rTasks(){sig=TK.map(st).join();const dn=TK.filter(t=>st(t)=='done').length;
$('#tasks').innerHTML=`<h2>Earn Rewards</h2><div class="m">Complete tasks to boost your balance</div><div class="card"><div class="row"><b>${dn} / ${TK.length} completed</b><b class="g">+${sum(TK.map(t=>t.r))} APX available</b></div><div class="bar"><i style="width:${dn/TK.length*100}%"></i></div></div>`+TK.map(t=>{const s=st(t);return`<div class="card task"><div class="ic">${t.i}</div><div class="fx"><b>${t.t}</b><div class="g">+${t.r} APX${t.d?' · daily':''}</div></div><button class="btn" data-d="task:${t.id}" ${s=='done'||s=='wait'?'disabled':''}>${{go:'Go',wait:'…',claim:'Claim',done:'Done ✓'}[s]}</button></div>`}).join('')}
function rChart(){const h=hist(),tot=sum(h);let c=0;const cs=h.map(v=>c+=v),mx=Math.max(...cs,1e-9),p=cs.map((v,i)=>[4+i*12.7,78-v/mx*62]),l='M'+p.map(a=>a[0].toFixed(1)+','+a[1].toFixed(1)).join('L');
$('#mc').innerHTML=`<div class="card"><div class="row"><div><div class="m">24H P&amp;L</div><b class="big g">+${f(tot,3)} APX</b></div><span class="pill">● LIVE</span></div><svg class="ch" viewBox="0 0 300 90"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5c451" stop-opacity=".45"/><stop offset="1" stop-color="#f5c451" stop-opacity="0"/></linearGradient></defs><path d="${l}L296,90L4,90Z" fill="url(#gg)"/><path d="${l}" fill="none" stroke="#f5c451" stroke-width="2.2" stroke-linejoin="round"/><circle cx="296" cy="${p[23][1].toFixed(1)}" r="4" fill="#ffe9a8"><animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/></circle></svg><div class="grid3 c"><div><span class="m">Peak / hr</span><b>${f(Math.max(...h),3)}</b></div><div><span class="m">Hashrate</span><b>${MN[S.m].th} TH/s</b></div><div><span class="m">Avg / hr</span><b>${f(tot/24,3)}</b></div></div></div>`}
function rMiners(){$('#miners').innerHTML='<h2>Miner Store</h2><div class="m">Upgrade to mine faster</div><div id="mc"></div>'+MN.map((m,i)=>{const a=i==S.m,o=i<S.m,nx=i==S.m+1;return`<div class="card mn ${a?'act':''}"><div class="ic">${i>S.m?'🔒':'⛏️'}</div><div class="fx"><b>Level ${i+1} · ${m.n}</b><div class="m">${m.th} TH/s · ${f(m.tap,1)} / tap</div>${i>S.m?`<div class="g">NEED ${f(m.p,0)} Tokens</div>`:''}</div>${a?'<span class="lv ok">ACTIVE</span>':o?'<span class="lv">OWNED</span>':`<button class="btn" data-d="up:${i}" ${nx&&S.bal>=m.p?'':'disabled'}>${nx?'Upgrade':'Locked'}</button>`}</div>`}).join('');rChart()}
function rFriends(){const r=S.rf,pn=r.ok*10-r.cl;
$('#friends').innerHTML=`<h2>Referral Program</h2><div class="m">Invite friends and earn together</div>
<div class="card cert"><div class="m">ApexPulse · Certificate of Membership</div><div class="cn">${name}</div><div class="m">ID ${S.id}</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn fx" data-d="share">Share Certificate Card</button><button class="btn ghost" data-d="fam">+ Family Card</button></div>${Array.from({length:S.fam},(_,i)=>`<span class="chip">👤 Family Member #${i+1}</span>`).join('')}</div>
<div class="card"><div class="m">Your Invite Link</div><div class="link" style="margin-top:8px"><span>${link()}</span><button class="btn" data-d="copy">Copy</button></div></div>
<div class="grid2 c"><div class="card"><b class="big">${r.n}</b><span class="m">Total Referrals</span></div><div class="card"><b class="big">${r.ok}</b><span class="m">Successful Invites</span></div></div>
<div class="card row"><div><div class="m">Referral Reward</div><b class="big g">${f(pn)} APX</b></div><button class="btn" data-d="rclaim" ${pn>0?'':'disabled'}>Claim</button></div>
<div class="card"><div class="m">Team Wallet Earnings</div><div class="kv"><span>Direct bonus (10 APX / invite)</span><b>${f(r.ok*10)}</b></div><div class="kv"><span>Team mining share (5%)</span><b>${f(r.ok*2.5)}</b></div><div class="kv"><span>Already claimed</span><b>${f(r.cl)}</b></div><div class="kv"><span>Total earned</span><b class="g">${f(r.ok*12.5)} APX</b></div></div>
<button class="lnk" data-d="demo">+ simulate invite (demo only, remove before launch)</button>`}
function rProfile(){const tot=S.bal+S.pend,wd=S.ver?Math.floor(S.bal*.5):0;
$('#profile').innerHTML=`<h2>Profile</h2>
<div class="card prof"><div class="av">${name[0].toUpperCase()}</div><div class="fx"><b>${name}</b><div class="m">ID: ${S.id}</div></div><span class="lv ${S.ver?'ok':'no'}">${S.ver?'✔ VERIFIED':'UNVERIFIED'}</span></div>
${S.ver?'':'<button class="btn wide" data-d="verify">Verify Account</button>'}
<div class="card row"><b>Sound Effects</b><label class="sw"><input type="checkbox" id="sw" ${S.snd?'checked':''}><i></i></label></div>
<div class="card"><div class="m">VIP Status</div><div class="kv"><span>🔐 Vault Lock</span><b class="${S.ver?'g':''}">${S.ver?'50% unlocked':'Locked'}</b></div><div class="kv"><span>💎 Assets Bonus</span><b class="g">+${S.m*5}% mining</b></div></div>
<div class="card"><div class="m">Assets Valuation</div><b class="big g">$${f(tot*PRICE)} USD</b><div class="m">${f(tot)} APX · 1 APX ≈ $${PRICE}</div></div>
<div class="grid2"><div class="card"><div class="m">Holding Wallet</div><b class="big">${f(S.bal)}</b><span class="m">APX</span></div><div class="card"><div class="m">Pool Wallet</div><b class="big g">${f(wd,0)}</b><span class="m">withdrawable</span><button class="btn sm wide" data-d="wd" ${wd>=100&&S.w?'':'disabled'}>Withdraw</button></div></div>
<div class="m" style="text-align:center;margin-top:10px;text-transform:none;font-weight:400">Withdrawals need a verified account, a connected wallet and at least 100 APX.</div>`}
const H={
wallet(){/* demo only: replace with TON Connect */if(S.w){S.w='';toast('Wallet disconnected')}else{S.w='UQ'+Array.from({length:46},()=>'0123456789abcdef'[Math.random()*16|0]).join('');toast('Wallet connected ✓')}save();upd();if(tab=='profile')rProfile()},
snd(){S.snd=S.snd?0:1;save();upd();toast(S.snd?'Sound on':'Sound off')},
guide(){$('#sh').classList.add('on')},close(){$('#sh').classList.remove('on')},
claim(){if(S.pend<.01)return toast('Nothing to claim yet');const a=S.pend;S.bal+=a;S.pend=0;save();upd();hap('medium');beep(880,.15);toast('Claimed '+f(a)+' APX ✓')},
task(id){const t=TK.find(x=>x.id==id),s=st(t);if(s=='go'){S.tk[id]=Date.now();t.u&&ext(t.u)}else if(s=='claim'){S.tk[id]=t.d?Date.now():'d';S.bal+=t.r;earn(t.r);toast('+'+t.r+' APX');hap('medium');beep(880,.15)}save();rTasks();upd()},
up(i){i=+i;const m=MN[i];if(i!=S.m+1||S.bal<m.p)return;S.bal-=m.p;S.m=i;save();rMiners();upd();hap('heavy');toast('⛏️ '+m.n+' activated')},
copy(){const l=link(),ok=()=>toast('Link copied ✓');(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(ok,()=>{const t=document.createElement('textarea');t.value=l;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove();ok()})},
share(){const l=link(),x='Join me on ApexPulse and start mining! ⛏️',u='https://t.me/share/url?url='+encodeURIComponent(l)+'&text='+encodeURIComponent(x);tg?.openTelegramLink?tg.openTelegramLink(u):navigator.share?navigator.share({title:'ApexPulse',text:x,url:l}).catch(()=>{}):H.copy()},
fam(){if(S.fam>=3)return toast('Maximum 3 family cards');S.fam++;save();rFriends();toast('Family card #'+S.fam+' created')},
rclaim(){const p=S.rf.ok*10-S.rf.cl;if(p<=0)return;S.rf.cl+=p;S.bal+=p;earn(p);save();rFriends();upd();hap('medium');toast('+'+f(p)+' APX referral reward')},
demo(){S.rf.n++;if(Math.random()<.7)S.rf.ok++;save();rFriends()},
verify(){if(!S.w)return toast('Connect your wallet first');if(!TK.some(t=>st(t)=='done'))return toast('Complete at least one task');S.ver=1;save();rProfile();toast('Account verified ✔')},
wd(){const a=Math.floor(S.bal*.5);if(!S.ver||!S.w||a<100)return;S.bal-=a;save();rProfile();upd();toast(f(a,0)+' APX withdrawal queued')}};
let tab='mine';
function show(t){tab=t;$$('.tab').forEach(s=>s.classList.toggle('on',s.id==t));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));$('main').scrollTop=0;({tasks:rTasks,miners:rMiners,friends:rFriends,profile:rProfile})[t]?.();try{tg?.HapticFeedback?.selectionChanged()}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b&&!b.disabled){const[a,x]=b.dataset.d.split(':');H[a]?.(x)}const n=e.target.closest('nav button');if(n)show(n.dataset.t)});
document.addEventListener('change',e=>{if(e.target.id=='sw'){S.snd=+e.target.checked;save();upd()}});
document.addEventListener('gesturestart',e=>e.preventDefault());
$('#sh').addEventListener('click',e=>{if(e.target.id=='sh')H.close()});
$('#coin').addEventListener('pointerdown',e=>{if(S.en<1)return toast('No energy. Recharging…');const v=MN[S.m].tap*mult();S.en--;S.pend+=v;earn(v);beep(500+Math.random()*250);hap();fl(e.clientX,e.clientY,'+'+f(v,2));upd();save()});
let n=0;function tick(){const t=Date.now(),dt=Math.min(Math.max((t-S.ts)/1e3,0),10800);S.ts=t;S.en=Math.min(MAX,S.en+dt*0.5);const g=MN[S.m].th*.0005*mult()*dt;S.pend+=g;earn(g);save();upd();if(tab=='miners'&&++n%5==0)rChart();if(tab=='tasks'&&TK.map(st).join()!=sig)rTasks()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
setInterval(tick,1000);tick();
</script></body></html>
